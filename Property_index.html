<style>
:root{--navy:#1F3864;--navy2:#2B4C7E;--cyan:#4DD9F5;--cyanL:#E6F9FD;--bg:#F3F4F6;--card:#FFFFFF;--line:#E1E4E8;--txt:#1F2328;--sub:#5B6470;--muted:#8A929C;
 --good:#1E7B34;--goodB:#E3F4E7;--warn:#9A5B00;--warnB:#FFF1D6;--bad:#B42318;--badB:#FDE7E5;--info:#1F5FA8;--infoB:#E5EFFB;--r:10px}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{font-family:"Segoe UI",-apple-system,Roboto,Helvetica,Arial,sans-serif;color:var(--txt);background:#D9DDE3;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.app{width:100%;height:100vh;height:100dvh;margin:0;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}
/* header (same on every screen) */
.hdr{flex:0 0 64px;background:#fff;border-top:4px solid var(--cyan);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px}
.hdr .back{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--navy)}
.hdr .back[hidden]{display:none}.hdr .back:hover{background:var(--cyanL)}
.hdr img{height:38px;display:block}.hdr .vr{width:1px;height:30px;background:var(--line)}
.hdr .ttl{display:flex;flex-direction:column;line-height:1.15}.hdr .ttl b{font-size:18px;color:var(--navy);font-weight:600}
.crumb{font-size:12.5px;color:var(--sub)}.crumb a{color:var(--info);cursor:pointer;text-decoration:none}.crumb a:hover{text-decoration:underline}
.tabs{margin-left:auto;display:flex;gap:4px}.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:7px}
.tabs button:hover{background:var(--bg)}.tabs button.on{background:var(--navy);color:#fff}
.main{flex:1;min-height:0;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.foot{flex:0 0 34px;display:flex;align-items:center;gap:12px;padding:0 18px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);background:#fff}
.badge-ex{background:var(--warnB);color:var(--warn);border-radius:20px;padding:2px 9px;font-weight:600;font-size:11px}
/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.c-good{background:var(--goodB);color:var(--good)}.c-warn{background:var(--warnB);color:var(--warn)}.c-bad{background:var(--badB);color:var(--bad)}.c-info{background:var(--infoB);color:var(--info)}.c-grey{background:#EEF0F2;color:var(--sub)}.c-navy{background:var(--navy);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:7px;color:var(--navy)}
.btn:hover{background:var(--bg)}.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}.btn.pri:hover{background:var(--navy2)}
.btn.danger{color:var(--bad)}.btn.danger:hover{background:var(--badB)}.btn.ghost{border-color:transparent}
.ico{width:18px;height:18px;flex:0 0 auto}
/* home */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.kpi{padding:14px 16px;display:flex;gap:12px;align-items:center;cursor:pointer}.kpi:hover{border-color:var(--cyan)}
.kpi .ic{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--cyanL);color:var(--navy)}
.kpi .v{font-size:26px;font-weight:700;color:var(--navy);line-height:1}.kpi .l{font-size:12.5px;color:var(--sub);margin-top:3px}
.kpi.alert .ic{background:var(--badB);color:var(--bad)}.kpi.alert .v{color:var(--bad)}.kpi.amber .ic{background:var(--warnB);color:var(--warn)}

<script>/* Property App live - data layer (Graph + SharePoint REST + mapping). Pure functions are exported for unit tests. */
(function (root) {
'use strict';
// Logical schema used by the UI. Types: text, note, choice, date, number, lookup:<list>, image
const SCHEMA = {
  sites:  { Title:'text', Site_Type:'choice', Address:'text', Manager:'text', Notes:'note', Photos:'image' },
  assets: { Title:'text', Site:'lookup:sites', Asset_Type:'choice', Asset_Condition:'choice', Last_Inspection:'date', Next_Inspection:'date', Notes:'note', Photos:'image' },
  issues: { Title:'text', Site:'lookup:sites', Asset:'lookup:assets', Issue_Type:'choice', Priority:'choice', Status:'choice', Date_Logged:'date', Due_Date:'date', Cost:'number', Description:'note' }
};
const LIST_KEYS = ['sites','assets','issues'];

// ---------- dates (SharePoint date-only values come back from Graph as a UTC instant of local midnight, e.g. 2026-06-21T12:00:00Z for 22/06/2026 in NZ)
function partsInTz(ms, tz) {

    .formatToParts(new Date(ms)).forEach(x => { if (x.type !== 'literal') p[x.type] = +x.value; });

}

  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  const ms = Date.parse(v); if (isNaN(ms)) return null;
  const p = partsInTz(ms, tz);
  return `${p.year}-${String(p.month).padStart(2,'0')}-${String(p.day).padStart(2,'0')}`;
}
function toGraphDate(iso, tz) {

  const [y, m, d] = iso.split('-').map(Number); const guess = Date.UTC(y, m - 1, d);
  let t = guess - tzOffsetMs(guess, tz); t = guess - tzOffsetMs(t, tz);
  return new Date(t).toISOString().replace('.000Z', 'Z');

const stripHtml = s => (typeof s === 'string' && /<\/?(div|p|br|span)[\s>\/]/i.test(s))
  ? s.replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|div)>/gi, '\n').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/\n{3,}/g, '\n\n').trim()
  : s;

  if (!v) return null;
  let o = v; if (typeof v === 'string') { try { o = JSON.parse(v); } catch (e) { return null; } }
  if (!o || typeof o !== 'object') return null;
  return { fileName: o.fileName || '', serverRelativeUrl: o.serverRelativeUrl || '' };

// ---------- mapping
// fieldMap: { Title:'Title', Site_Type:'Site_x005f_Type', Photos:'' }  ('' or null = column not used)

    else if (t === 'date') rec[k] = fromGraphDate(f[name], tz);
    else if (t === 'number') rec[k] = (f[name] == null || f[name] === '') ? null : +f[name];

  const sch = SCHEMA[listKey], out = {};
  for (const k of Object.keys(sch)) {
    const name = fieldMap[k], t = sch[k];
    if (!name || t === 'image' || !(k in rec)) continue;
    if (prev && JSON.stringify(prev[k] ?? null) === JSON.stringify(rec[k] ?? null)) continue;
    const v = rec[k];
    if (t.startsWith('lookup:')) out[name + 'LookupId'] = (v == null || v === '') ? null : String(v);
    else if (t === 'date') out[name] = toGraphDate(v, tz);
    else if (t === 'number') out[name] = (v == null || v === '' || isNaN(+v)) ? null : +v;
    else if (t === 'choice') out[name] = v ? String(v) : null;

async function demoGraphFetch(url) {
  const R = b => ({ ok: true, status: 200, headers: { get: () => null }, json: async () => b, text: async () => JSON.stringify(b) });
  const base = `https://${CONFIG.SITE_HOSTNAME}${CONFIG.SITE_PATH}`;
  const L = [['L-SITES', 'Property_Site_Master', 'Property Site Master'], ['L-ASSETS', 'Property_Asset_Register', 'Property Asset Register'], ['L-ISSUES', 'Property_Issue_Log', 'Property Issue Log'],
    ['L-OTHER', 'Vehicle_Checks', 'Vehicle Checks']].map(([id, n, dn]) => ({ id, name: n, displayName: dn, webUrl: `${base}/Lists/${n}`, list: { template: 'genericList', hidden: false } }));
  L.push({ id: 'L-DOCS', name: 'Shared Documents', displayName: 'Documents', webUrl: `${base}/Shared Documents`, list: { template: 'documentLibrary', hidden: false } });
  if (/\/sites\/[^/]+:\//.test(url)) return R({ id: 'demo-site', displayName: 'FAP (demo)', webUrl: base });
  if (/\/lists\?/.test(url)) return R({ value: L });
  const m = url.match(/\/lists\/([^/]+)\/columns/);
  if (m) {
    const key = { 'L-SITES': 'sites', 'L-ASSETS': 'assets', 'L-ISSUES': 'issues' }[m[1]];
    const cols = [{ name: 'Title', displayName: 'Title', text: {} }];
    if (key) for (const [f, t] of Object.entries(D.SCHEMA[key])) {
      if (f === 'Title') continue; let name = f;
      if (key === 'assets' && f === 'Asset_Condition') name = 'Condition';     // deliberate mismatch to show a suggestion
      if (t === 'image' && key === 'assets') continue;
      const c = { name, displayName: f };
      if (t === 'text') c.text = {}; else if (t === 'note') c.text = { allowMultipleLines: true }; else if (t === 'choice') c.choice = { choices: CHOICES[f] || [] };
      else if (t === 'date') c.dateTime = { format: 'dateOnly' }; else if (t === 'number') c.currency = { locale: 'en-NZ' }; else if (t.startsWith('lookup')) c.lookup = { columnName: 'Title' }; else c.thumbnail = {};
      cols.push(c);
    }
    cols.push({ name: 'Attachments', displayName: 'Attachments', boolean: {} });
    return R({ value: cols });

function hydrateFiles() {
  document.querySelectorAll('[data-files]').forEach(el => {
    const key = el.dataset.files, [k, idS] = key.split(':'), id = +idS, rec = arrOf(k).find(r => r.id === id);

          if (!x.loading && !x.failed) { x.loading = true; BACK.blob(x.path).then(b => { x.blobUrl = URL.createObjectURL(b); x.loading = false; hydrateFiles(); }).catch(() => { x.loading = false; x.failed = true; hydrateFiles(); }); }

        }

}
function photoName(i) { const n = new Date(); return `Photo_${isoLocal(n).replace(/-/g, '')}_${pad(n.getHours())}${pad(n.getMinutes())}${pad(n.getSeconds())}${i ? '_' + i : ''}.jpg`; }

    if (!String(out.Title || '').trim()) { $('w_Title').classList.add('err'); $('e_Title').focus(); return; }
    out.Title = out.Title.trim();
    const arr = arrOf(from), key = nameOf[from], files = queue.slice();
    const finish = id => { ST[key] = id; if (from === 'assets') ST.aSite = out.Site ? String(out.Site) : 'All'; if (from === 'issues') { ST.iSite = 'All'; ST.iStat = 'All'; } ST.hist.pop(); ST.screen = from; ST.edit = null; ST.pd = true; scrollTo(0, 0); };
    if (isNew) {
      const tmp = -Date.now(); out.id = tmp; out._hasAtt = false; delete out.ex;
      mutate({ apply: () => { arr.push(out); finish(tmp); },
        call: async () => { const id = await BACK.create(from, out); out.id = id; if (ST[key] === tmp) ST[key] = id; render(); if (files.length) await uploadFiles(from, id, files); },
        revert: () => { const i = arr.indexOf(out); if (i >= 0) arr.splice(i, 1); }, ok: files.length ? null : (DEMO ? `Saved new ${name} (demo)` : `New ${name} saved to SharePoint`), failMsg: 'Save failed' });
    } else {
      const live = arr.find(r => r.id === out.id), prev = { ...live };
      mutate({ apply: () => { Object.assign(live, out); finish(out.id); }, call: async () => { await BACK.update(from, { ...live }, prev); if (files.length) await uploadFiles(from, live.id, files); },
        revert: () => { for (const k of Object.keys(live)) delete live[k]; Object.assign(live, prev); }, ok: files.length ? null : (DEMO ? 'Changes saved (demo)' : 'Changes saved to SharePoint'), failMsg: 'Save failed' });
    }
  };
}
/* =============================== CHECK SETUP =============================== */
const DG = { running: false, res: null, suggest: {} };
const LISTLBL = { sites: 'Sites', assets: 'Assets', issues: 'Issues' };
function renderSetup() {
  const fieldsAll = Object.fromEntries(D.LIST_KEYS.map(k => [k, effFields(k)]));
  const savedL = LS.get('lists', {});
  const cfgRows = [['Mode', DEMO ? 'Demo (CLIENT_ID/TENANT_ID blank, or ?demo=1)' : 'Live'], ['Signed in as', DEMO ? '—' : (USER || 'not signed in')], ['Tenant ID', CONFIG.TENANT_ID || '(blank)'], ['Client ID', CONFIG.CLIENT_ID || '(blank)'],
    ['Redirect URI', CONFIG.REDIRECT_URI || (location.origin + location.pathname)], ['SharePoint site', SITE_URL],
    ...D.LIST_KEYS.map(k => [LISTLBL[k] + ' list', savedL[k] ? `${savedL[k].name} (saved on this device)` : (CONFIG.LISTS[k] || '(not set)')])];
  const r = DG.res;
  let out = `<div class="setup">
  ${ERRMSG && !DEMO ? `<div class="card" style="border-color:var(--bad)" id="setupNeeded"><b style="color:var(--bad)">Setup needed:</b> ${esc(ERRMSG)} Click <b>Run checks</b>.</div>` : ''}
  <div class="card"><h3>Check setup${DEMO ? ' <span class="badge-ex">Demo: simulated site</span>' : ''}</h3><p>Checks the SharePoint site, lists all lists on it so you can pick Sites/Assets/Issues, compares each list's columns with the app's mapping, and tests photo attachments. ${DEMO ? 'In demo mode the site and lists are simulated so you can see what the report looks like.' : 'Nothing is changed in SharePoint.'}</p>
   <div class="tw"><table class="t">${cfgRows.map(([a, b]) => `<tr><th style="width:190px">${a}</th><td><code>${esc(b)}</code></td></tr>`).join('')}</table></div>
   <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn pri" id="dRun"${DG.running ? ' disabled' : ''}>${DG.running ? 'Checking…' : 'Run checks'}</button><button class="btn" id="dReset">Clear saved settings on this device</button></div></div>`;
  if (r) {
    out += `<div class="card" id="dSite"><h3>1. SharePoint site</h3>${r.siteErr ? `<div class="res"><span class="chip c-bad">Failed</span><span>${esc(r.siteErr)}</span></div>` : `<div class="res"><span class="chip c-good">OK</span><span>${esc(r.site.displayName || '')} · <code>${esc(r.site.webUrl || '')}</code></span></div>`}</div>`;
    if (r.lists) {
      const gl = r.lists.filter(l => !(l.list && l.list.hidden));
      const optsFor = k => `<option value="">— Choose —</option>` + gl.map(l => `<option value="${esc(l.id)}"${r.pick[k] === l.id ? ' selected' : ''}>${esc(l.displayName)} (${esc(D.urlName(l))})</option>`).join('');
      out += `<div class="card" id="dLists"><h3>2. Lists on this site (${gl.length})</h3><p>Pick which list holds Sites, Assets and Issues, then save. The choice is stored on this device. To make it permanent, put the URL name into <code>CONFIG.LISTS</code>.</p>
      <div class="pick">${D.LIST_KEYS.map(k => `<div><label for="pk_${k}">${LISTLBL[k]} list</label><select class="f" id="pk_${k}">${optsFor(k)}</select></div>`).join('')}</div>
      <button class="btn pri" id="dSaveLists">Save list choice</button>
      <div class="tw" style="margin-top:12px"><table class="t" id="dListTable"><tr><th>Display name</th><th>URL name</th><th>Type</th><th>List id</th></tr>${gl.map(l => `<tr><td>${esc(l.displayName)}</td><td><code>${esc(D.urlName(l))}</code></td><td>${esc((l.list && l.list.template) || '')}</td><td><code>${esc(l.id)}</code></td></tr>`).join('')}</table></div></div>`;
    }
    if (r.cols) {
      const sug = {};
      out += `<div class="card" id="dCols"><h3>3. Columns</h3><p>Each app field must point at the column's <b>internal</b> name, which can differ from the display name (e.g. <code>Site_x005f_Type</code>).</p>`;
      const chip = s => ({ ok: '<span class="chip c-good">OK</span>', off: '<span class="chip c-grey">Not used</span>', optional: '<span class="chip c-grey">Optional</span>', suggest: '<span class="chip c-warn">Fix</span>', unmapped: '<span class="chip c-warn">Available</span>', type: '<span class="chip c-bad">Type</span>', missing: '<span class="chip c-bad">Missing</span>' }[s]);
      for (const k of D.LIST_KEYS) {
        const c = r.cols[k]; if (!c) continue;
        if (c.err) { out += `<h4 style="color:var(--navy);margin:14px 0 6px">${LISTLBL[k]}</h4><div class="res"><span class="chip c-bad">Not checked</span>${esc(c.err)}</div>`; continue; }
        sug[k] = c.suggested;
        out += `<h4 style="color:var(--navy);margin:14px 0 6px">${LISTLBL[k]} ${c.ok ? '<span class="chip c-good">All good</span>' : '<span class="chip c-warn">Needs attention</span>'}</h4>
        <div class="tw"><table class="t"><tr><th>App field</th><th>Mapped to</th><th>Status</th><th>Found column</th><th>Note</th></tr>${c.rows.map(x => `<tr><td>${esc(x.field)}</td><td><code>${esc(x.mapped || '—')}</code></td><td>${chip(x.status)}</td><td>${x.displayName ? esc(x.displayName) + ' · ' + esc(x.actualType) : ''}${x.choices ? `<br><span style="color:var(--sub);font-size:12px">${esc(x.choices.join(', '))}</span>` : ''}</td><td>${esc(x.note)}</td></tr>`).join('')}</table></div>
        ${c.extra.length ? `<p style="font-size:12.5px">Other columns in this list (not used by the app): ${c.extra.map(x => `${esc(x.displayName)} <code>${esc(x.name)}</code>`).join(', ')}</p>` : ''}`;
        if (k === 'issues') { const st = c.rows.find(x => x.field === 'Status'); if (st && st.choices) { const miss = [S_OPEN, S_PROG, S_RES].filter(s => !st.choices.includes(s)); if (miss.length) out += `<div class="res"><span class="chip c-bad">Status</span>The Status choices don't include ${miss.map(esc).join(', ')}. Change <code>CONFIG.STATUS</code> to match.</div>`; } }
      }
      const merged = Object.fromEntries(D.LIST_KEYS.map(k => [k, Object.assign({}, fieldsAll[k], sug[k] || {})]));
      out += `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn pri" id="dApply">Use suggested column names</button></div>
      <p style="margin-top:12px">To make the mapping permanent, paste this over <code>FIELDS</code> in the CONFIG block:</p><textarea readonly id="dJson">FIELDS: ${esc(JSON.stringify(merged, null, 2))},</textarea></div>`;
      DG.suggest = sug;
    }
    if (r.att) out += `<div class="card" id="dAtt"><h3>4. Photo attachments (SharePoint REST)</h3><div class="res">${r.att.ok ? `<span class="chip c-good">OK</span><span>${esc(r.att.msg)}</span>` : `<span class="chip c-bad">Failed</span><span>${esc(r.att.msg)}</span>`}</div></div>`;
  }
  out += '</div>';
  $('main').innerHTML = out;
  $('dRun').onclick = () => runDiag();
  $('dReset').onclick = () => { LS.del('lists'); LS.del('fields'); LS.del('cache'); LS.del('siteId'); toast('Saved settings cleared'); DG.res = null; if (!DEMO) location.reload(); else render(); };
  if ($('dSaveLists')) $('dSaveLists').onclick = () => { const saved = {}; for (const k of D.LIST_KEYS) { const id = $('pk_' + k).value; if (!id) { toast(`Choose the ${LISTLBL[k]} list`, 'err'); return; } const l = r.lists.find(x => x.id === id); saved[k] = { id, name: D.urlName(l), displayName: l.displayName }; }
    LS.set('lists', saved); toast('List choice saved on this device'); runDiag(true); };
  if ($('dApply')) $('dApply').onclick = () => { const cur = LS.get('fields', {}); for (const k of D.LIST_KEYS) if (DG.suggest[k]) cur[k] = Object.assign({}, cur[k] || {}, DG.suggest[k]); LS.set('fields', cur); toast('Column names saved on this device'); runDiag(true); };
}
async function runDiag(reloadAfter) {
  if (!BACK) { toast('Sign in first', 'err'); return; } DG.running = true; render();
  const r = { pick: {} };
  try {
    const x = await BACK.diag(); r.site = x.site; r.lists = x.lists;
    const vis = x.lists.filter(z => !(z.list && z.list.hidden) && (!z.list || !z.list.template || z.list.template === 'genericList'));
    for (const k of D.LIST_KEYS) {
      const saved = LS.get('lists', {})[k];
      let l = (saved && x.lists.find(z => z.id === saved.id)) || D.matchList(x.lists, CONFIG.LISTS[k]);
      if (!l) { const word = { sites: 'site', assets: 'asset', issues: 'issue' }[k]; const g = vis.filter(z => new RegExp(word, 'i').test(z.displayName + ' ' + D.urlName(z))); if (g.length === 1) l = g[0]; }
      r.pick[k] = l ? l.id : '';
    }
    r.cols = {};
    await Promise.all(D.LIST_KEYS.map(async k => { if (!r.pick[k]) { r.cols[k] = { err: 'No list chosen yet. Pick it in section 2 and save.' }; return; }
      try { r.cols[k] = D.checkColumns(k, await BACK.columns(r.pick[k]), effFields(k)); } catch (e) { r.cols[k] = { err: friendly(e) }; } }));
    if (r.pick.issues) { try { const id = await BACK.firstItemId(r.pick.issues); if (id == null) r.att = { ok: true, msg: 'The Issues list has no items to test yet.' }; else { const a = await BACK.attTest(r.pick.issues, id); r.att = { ok: true, msg: `Read the attachments of issue #${id}: ${a.length} file(s).` }; } } catch (e) { r.att = { ok: false, msg: friendly(e) + ' Photos need the SharePoint AllSites.Write permission (see the Setup Guide).' }; } }
  } catch (e) { r.siteErr = friendly(e); }
  DG.res = r; DG.running = false;
  if (reloadAfter === true && !DEMO && D.LIST_KEYS.every(k => effListRef(k))) { ERRMSG = null; BACK = LiveBackend(); await sync(); if (!ERRMSG && SITES.length && ST.screen === 'setup') { ST.hist = []; ST.screen = 'home'; toast('Connected to SharePoint'); } render(); return; }
  render();
}

/* =============================== BOOT =============================== */
let _ph = PHONE(); window.addEventListener('resize', () => { if (PHONE() !== _ph) { _ph = PHONE(); render(); } });
window.addEventListener('online', () => { if (BACK && !DEMO) sync(); });
window.addEventListener('offline', () => { if (!DEMO && BACK) { OFFLINE = true; RO = true; render(); } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && BACK && !DEMO && SYNCED && Date.now() - SYNCED > 120000) sync(); });
async function boot() {
  render();
  if (DEMO) { BACK = DemoBackend(); await sync(); return; }
  if (location.protocol === 'file:') { ERRMSG = 'Sign-in does not work from a file on your computer. Open the hosted https:// address instead (see the Setup Guide), or add ?demo=1 to the address to preview.'; ST.screen = 'error'; render(); return; }
  let signed = false;
  try { signed = await AUTH.init(); } catch (e) { console.error(e); ERRMSG = 'Sign-in error: ' + friendly(e); }
  if (!signed) { ST.screen = 'signin'; render(); return; }
  USER = AUTH.user(); BACK = LiveBackend();
  if (loadCache()) { ST.screen = 'home'; render(); }
  if (!navigator.onLine && SITES.length) { OFFLINE = true; RO = true; render(); return; }
  await sync();
}
if ('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:' && !window.PA_NO_SW) navigator.serviceWorker.register('sw.js').catch(() => {});
boot();
